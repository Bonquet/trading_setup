name: XAUUSD Weekly Review

on:
  schedule:
    # Friday 21:00 UTC — after NY close, before weekend
    - cron: "0 21 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WHATSAPP_BACKEND: twilio
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
      TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      TWILIO_TO: ${{ secrets.TWILIO_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly stats + notify
        run: |
          DAYS="${{ inputs.days }}"
          DAYS="${DAYS:-7}"
          python scripts/weekly_stats.py --days "$DAYS" --notify

      - name: Commit weekly_stats.json
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cache/weekly_stats.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: weekly review $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
